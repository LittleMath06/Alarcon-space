{% extends "base.html" %}
{% block titulo %}Primeiro acesso{% endblock %}
{% block publico %}
<section class="cartao estreito">
  <h1>Primeiro acesso</h1>
  <p class="sub">Crie o usuário que vai usar o sistema. Isto só aparece uma vez.</p>
  {% if erro %}<p class="aviso erro" role="alert">{{ erro }}</p>{% endif %}
  <form method="post" action="/primeiro-acesso" class="formulario">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Seu nome <input name="nome" required value="{{ nome or '' }}" autofocus></label>
    <label>Login <input name="login" autocomplete="username" required value="{{ login or '' }}"></label>
    <label>Senha (mínimo 10 caracteres) <input name="senha" type="password" autocomplete="new-password" minlength="10" required></label>
    <label>Confirme a senha <input name="confirmacao" type="password" autocomplete="new-password" minlength="10" required></label>
    <button type="submit" class="botao">Criar usuário</button>
  </form>
</section>
{% endblock %}
